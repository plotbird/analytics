name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: every file must parse on the oldest supported PHP, which also
  # catches syntax that only exists in newer versions (enums, readonly, ...).
  lint:
    name: Lint (PHP 8.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: php -l over every file
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "::error file=${file}::${output}"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "PHP 8.0 could not parse every file"
            exit 1
          fi
          echo "all PHP files parse on $(php -r 'echo PHP_VERSION;')"

  # The compiled stylesheet is committed, so it has to match the templates.
  # Without this, a class renamed in a template renders as nothing at all and
  # nobody notices until a page looks broken.
  css:
    name: Compiled CSS is up to date
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Fail if the committed stylesheet differs
        run: |
          if ! git diff --exit-code --stat assets/css/tailwind.css; then
            echo "::error::assets/css/tailwind.css is out of date - run 'npm run build:css' and commit the result"
            exit 1
          fi

  # The real suite: installs the application through the browser installer and
  # exercises every page and endpoint.
  e2e:
    name: E2E (PHP ${{ matrix.php }}, MySQL 8.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4' ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          # `root` must be reachable over TCP from the runner, not only from
          # inside the container: the suite drops and recreates the database.
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: plotbird
          MYSQL_USER: plotbird
          MYSQL_PASSWORD: plotbird
        ports:
          - 3306:3306
        # `options:` is passed straight to `docker create`, so only docker flags
        # belong here. A mysqld flag such as --default-authentication-plugin is
        # rejected with "unknown flag" and the container never starts (exit 125).
        # PHP's mysqlnd has spoken caching_sha2_password since 7.4, so the server
        # default is fine.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PB_TEST_DB_HOST: '127.0.0.1'
      PB_TEST_DB_PORT: '3306'
      PB_TEST_PORT: '8099'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, zlib
          coverage: none
      - name: Show the versions under test
        run: php -v && php -m | sort | tr '\n' ' '
      - name: Run the end-to-end suite
        run: |
          set -o pipefail
          php tests/e2e.php 2>&1 | tee suite.log

      # The suite installs the application in the document root. A second
      # installation in a sub-directory is what broke every generated link once,
      # so the URL helpers are checked against both layouts.
      - name: Check URL generation in both layouts
        run: php tests/urls.php

      # A failing assertion is put into the annotations, so the reason is
      # visible on the run page without opening a 5000-line log.
      - name: Report the failure
        if: failure()
        run: |
          [ -f suite.log ] || exit 0
          first="$(grep -m1 -E '^[[:space:]]*FAIL' suite.log | sed 's/^[[:space:]]*//' || true)"
          if [ -n "$first" ]; then
            echo "::error title=End-to-end failure::${first}"
          fi
          {
            echo "### Suite failures"
            echo '```'
            sed -n '/^Failures:/,$p' suite.log || tail -n 60 suite.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the application logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs-php${{ matrix.php }}
          path: |
            data/logs/
            config/config.php
            suite.log
          if-no-files-found: ignore
          retention-days: 7

  # MariaDB is what most shared hostings actually run, and it is a separate
  # code path for DDL. One job is enough to prove it works.
  mariadb:
    name: E2E (MariaDB 11.4)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: plotbird
          MARIADB_USER: plotbird
          MARIADB_PASSWORD: plotbird
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PB_TEST_DB_HOST: '127.0.0.1'
      PB_TEST_DB_PORT: '3306'
      PB_TEST_PORT: '8099'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, zlib
          coverage: none
      - name: Run the end-to-end suite
        run: |
          set -o pipefail
          php tests/e2e.php 2>&1 | tee suite.log

      # The suite installs the application in the document root. A second
      # installation in a sub-directory is what broke every generated link once,
      # so the URL helpers are checked against both layouts.
      - name: Check URL generation in both layouts
        run: php tests/urls.php

      # A failing assertion is put into the annotations, so the reason is
      # visible on the run page without opening a 5000-line log.
      - name: Report the failure
        if: failure()
        run: |
          [ -f suite.log ] || exit 0
          first="$(grep -m1 -E '^[[:space:]]*FAIL' suite.log | sed 's/^[[:space:]]*//' || true)"
          if [ -n "$first" ]; then
            echo "::error title=End-to-end failure::${first}"
          fi
          {
            echo "### Suite failures"
            echo '```'
            sed -n '/^Failures:/,$p' suite.log || tail -n 60 suite.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the application logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs-mariadb
          path: |
            data/logs/
            suite.log
          if-no-files-found: ignore
          retention-days: 7

  # Importing the bundled IP database is the slowest and most failure-prone part
  # of an installation, so it gets its own job with the real 4 MB of data.
  geoip:
    name: E2E with GeoIP import
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          # `root` must be reachable over TCP from the runner, not only from
          # inside the container: the suite drops and recreates the database.
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: plotbird
          MYSQL_USER: plotbird
          MYSQL_PASSWORD: plotbird
        ports:
          - 3306:3306
        # `options:` is passed straight to `docker create`, so only docker flags
        # belong here. A mysqld flag such as --default-authentication-plugin is
        # rejected with "unknown flag" and the container never starts (exit 125).
        # PHP's mysqlnd has spoken caching_sha2_password since 7.4, so the server
        # default is fine.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PB_TEST_DB_HOST: '127.0.0.1'
      PB_TEST_DB_PORT: '3306'
      PB_TEST_PORT: '8099'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, zlib
          coverage: none
      - name: Run the end-to-end suite with the IP database
        env:
          PB_GEOIP_TRACE: '1'
        run: |
          set -o pipefail
          php tests/e2e.php --with-geoip 2>&1 | tee suite.log

      - name: Report the failure
        if: failure()
        run: |
          [ -f suite.log ] || exit 0
          first="$(grep -m1 -E '^[[:space:]]*FAIL' suite.log | sed 's/^[[:space:]]*//' || true)"
          if [ -n "$first" ]; then
            echo "::error title=End-to-end failure::${first}"
          fi
          {
            echo "### Suite failures"
            echo '```'
            sed -n '/^Failures:/,$p' suite.log || tail -n 60 suite.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the application logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs-geoip
          path: |
            data/logs/
            suite.log
          if-no-files-found: ignore
          retention-days: 7
